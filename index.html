const normV= vs => vs.map(v => typeof v===“string”?{name:v,options:[]}:v);
const ensureArray = v => {
if(!v) return [];
if(Array.isArray(v)) return v;
return Object.values(v);
};
const yen  = n => n.toLocaleString(“ja-JP”)+“円”;

const parseHours = (s=“09:00”,e=“16:00”,breakMin=60) => {
const [sh,sm]=s.split(”:”).map(Number);
const [eh,em]=e.split(”:”).map(Number);
const total=(eh*60+em)-(sh*60+sm);
return Math.round((total-breakMin)/60*100)/100;
};

const downloadCSV = (filename, rows) => {
const bom=”\uFEFF”;
const csv=bom+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(”,”)).join(”\n”);
const blob=new Blob([csv],{type:“text/csv;charset=utf-8;”});
const url=URL.createObjectURL(blob);
const a=document.createElement(“a”);
a.href=url;a.download=filename;a.click();
URL.revokeObjectURL(url);
};

const stLoad=async k=>{try{const snap=await firebase.database().ref(’/data/’+k).get();if(!snap.exists())return null;const val=snap.val();if(typeof val===“string”){try{return JSON.parse(val);}catch{return val;}}return val;}catch(e){return null;}};
const stSave=async(k,v)=>{await firebase.database().ref(’/data/’+k).set(JSON.stringify(v));};

function App(){

const [year,setYear]  =useState(now.getFullYear());
const [month,setMonth]=useState(now.getMonth()+1);

const [uname,setUname]=useState(””);

const [busy,setBusy]  =useState(false);
const [toast,setToast]=useState(””);

const ym =ymS(year,month);
const raw=D.settings||{staff:DEFAULT_STAFF,venues:DEFAULT_VENUES};
const parsePipe = (str,fallback) => {
if(str && typeof str===“string”) return str.split(”|”).filter(Boolean);
return fallback;
};
const mcStaffData   = parsePipe(D.mcStaff,   ensureArray(raw.mcStaff));
const assistStaffData = parsePipe(D.assistStaff, ensureArray(raw.assistStaff));
const cfg={…raw,
venues:normV(ensureArray(raw.venues)),
staff:ensureArray(raw.staff).length>0?ensureArray(raw.staff):DEFAULT_STAFF,
mcStaff:mcStaffData.length>0?mcStaffData:DEFAULT_MC_STAFF,
assistStaff:assistStaffData.length>0?assistStaffData:DEFAULT_ASSIST_STAFF,
staffRates:raw.staffRates||{},
ashibeRates:raw.ashibeRates||{},
};

const flash=msg=>{setToast(msg);setTimeout(()=>setToast(””),2500);};

const reload=useCallback(async()=>{
setBusy(true);
const [s,sh,pr,at,vc,mcs,asts]=await Promise.all([
stLoad(“settings”),stLoad(`shift-${ym}`),stLoad(`pref-${ym}`),
stLoad(`att-${ym}`),stLoad(`vconf-${ym}`),
stLoad(“mcStaff_str”),stLoad(“assistStaff_str”),
]);
setD({
settings:s,shifts:sh||{},prefs:pr||{},att:at||{},vconf:vc||{},
mcStaff:mcs||null,assistStaff:asts||null,
});
setBusy(false);
},[ym]);

useEffect(()=>{reload();},[reload]);

const sv={
shifts:v=>{setD(d=>({…d,shifts:v}));stSave(`shift-${ym}`,v);flash(“✅ シフトを保存しました”);},
prefs: v=>{setD(d=>({…d,prefs:v})); stSave(`pref-${ym}`,v); flash(“✅ 希望を保存しました”);},
att:   v=>{setD(d=>({…d,att:v}));   stSave(`att-${ym}`,v);  flash(“✅ 出勤記録を保存しました”);},
vconf: v=>{setD(d=>({…d,vconf:v})); stSave(`vconf-${ym}`,v);},
sets: async v=>{
setD(d=>({…d,settings:v}));
await stSave(“settings”,v);
flash(“✅ 設定を保存しました”);
},
updateSettings: v=>{setD(d=>({…d,settings:v}));},
mcStaff: v=>{
setD(d=>({…d,mcStaff:v.join(”|”)}));
stSave(“mcStaff_str”,v.join(”|”));
},
assistStaff: v=>{
setD(d=>({…d,assistStaff:v.join(”|”)}));
stSave(“assistStaff_str”,v.join(”|”));
},
};

const generate=()=>{
const {staff,venues}=cfg;
const days=getDays(year,month);
const ns={…D.shifts};
const totalCnt={}, venueCnt={};
staff.forEach(s=>{totalCnt[s]=0;venueCnt[s]={};venues.forEach(v=>{venueCnt[s][v.name]=0;});});
Object.entries(ns).forEach(([d,dd])=>Object.entries(dd).forEach(([vn,sn])=>{
if(totalCnt[sn]!==undefined){totalCnt[sn]++;if(venueCnt[sn]?.[vn]!==undefined)venueCnt[sn][vn]++;}
}));
for(let d=1;d<=days;d++){
if(!ns[d])ns[d]={};
const used=new Set();
for(const v of venues){
if(ns[d][v.name]){used.add(ns[d][v.name]);continue;}
const avail=staff.filter(s=>(D.prefs[s]||[]).includes(d)&&!used.has(s));
if(!avail.length){ns[d][v.name]=””;continue;}
avail.sort((a,b)=>{
const vd=(venueCnt[a]?.[v.name]||0)-(venueCnt[b]?.[v.name]||0);
return vd!==0?vd:(totalCnt[a]||0)-(totalCnt[b]||0);
});
ns[d][v.name]=avail[0];
used.add(avail[0]);
totalCnt[avail[0]]=(totalCnt[avail[0]]||0)+1;
if(venueCnt[avail[0]]?.[v.name]!==undefined)venueCnt[avail[0]][v.name]++;
}
}
sv.shifts(ns);
};

cfg,sv,generate,uname,role,busy,flash};

return (

color:”#fff”,padding:“10px 20px”,borderRadius:10,fontSize:13,fontWeight:600,
boxShadow:“0 4px 20px rgba(0,0,0,.2)”}}>{toast}</div>}

{!busy&&role===“admin”  &&<AdminView  {…P}/>}
{!busy&&role===“staff”  &&<StaffView  {…P}/>}
{!busy&&role===“venue”  &&<VenueView  {…P}/>}
{!busy&&role===“office” &&<OfficeView {…P}/>}
{!busy&&(role===“mc”||role===“assist”)&&<MCStaffView {…P}/>}
</div>
</div>
);
}

function MonthSel({year,month,setYear,setMonth}){
const prev=()=>{if(month===1){setYear(y=>y-1);setMonth(12);}else setMonth(m=>m-1);};
const next=()=>{if(month===12){setYear(y=>y+1);setMonth(1);}else setMonth(m=>m+1);};
return (
<div style={{display:“flex”,alignItems:“center”,gap:12,marginBottom:16}}>
<button onClick={prev} style={{…Btn(C.white,C.text),border:`1px solid ${C.border}`,padding:“6px 14px”}}>‹</button>
<span style={{fontWeight:800,fontSize:18}}>{year}年{month}月</span>

function AdminPrefView({year,month,prefs,shifts,cfg}){

const need=venues.length;

const deadlineMonth=month===1?12:month-1;
const deadlineYear =month===1?year-1:year;
const deadline=new Date(deadlineYear,deadlineMonth-1,16,23,59,59);
const isLocked=today>deadline;
const diffDays=Math.ceil((deadline-today)/(1000*60*60*24));
const dayInfo=Array.from({length:days},(_,i)=>{
const d=i+1;
const applicants=staff.filter(s=>(prefs[s]||[]).includes(d));
const assigned=venues.map(v=>shifts[d]?.[v.name]).filter(Boolean);
return {d,applicants,assigned};
});
const over =dayInfo.filter(x=>x.applicants.length>need);

const empty=dayInfo.filter(x=>x.applicants.length===0);

background:isLocked?”#fff0f0”:diffDays<=3?”#fff0f0”:diffDays<=7?C.amberL:C.greenL,

{over.map(({d,applicants,assigned})=>{
const wdi=getWdayI(year,month,d);
return <div key={d} style={{display:“flex”,alignItems:“center”,gap:8,flexWrap:“wrap”,
borderBottom:`1px solid ${C.border}`,padding:“8px 0”}}>
<span style={{fontWeight:700,minWidth:72,color:wdi===0?C.sun:wdi===6?C.sat:C.text}}>

<div style={{display:“flex”,gap:4,flex:1,flexWrap:“wrap”}}>
{applicants.map(s=><span key={s} style={{background:C.redL,color:C.red,borderRadius:5,

</div>

function AdminShiftView({year,month,shifts,prefs,cfg,sv,generate}){
const days=getDays(year,month);
const {staff,venues}=cfg;
// ★修正：初回のみshiftsで初期化、dirty中は上書きしない
const [local,setLocal]=useState(shifts);
const [dirty,setDirty]=useState(false);
useEffect(()=>{ if(!dirty) setLocal(shifts); },[shifts,dirty]);

const vCnt={};
staff.forEach(s=>{vCnt[s]={};venues.forEach(v=>{vCnt[s][v.name]=0;});});
Object.values(local).forEach(dd=>Object.entries(dd).forEach(([vn,sn])=>{
if(vCnt[sn]?.[vn]!==undefined)vCnt[sn][vn]++;
}));
const totalCnt={};
staff.forEach(s=>totalCnt[s]=venues.reduce((a,v)=>a+(vCnt[s]?.[v.name]||0),0));

const setCell=(d,vn,v)=>{
setLocal(prev=>({…prev,[d]:{…(prev[d]||{}),[vn]:v}}));
setDirty(true);
};

const onGenerate=()=>{ generate(); setDirty(false); };
return <div>

{dirty?“💾 保存する”:“✅ 保存済み”}
</button>
{dirty&&<span style={{fontSize:12,color:C.amber,fontWeight:600}}>⚠️ 未保存の変更があります</span>}
</div>

<td style={{...TD,fontWeight:700}}>{s}</td>
{venues.map(v=><td key={v.name} style={{…TD,textAlign:“center”,

{vCnt[s]?.[v.name]||0}日</td>)}

{Object.keys(local).length>0&&<table style={{width:“100%”,borderCollapse:“collapse”,minWidth:380}}>
<thead><tr>
<th style={{...TH,width:32}}>日</th><th style={{...TH,width:26}}>曜</th>
{venues.map(v=><th key={v.name} style={TH}>{v.name}</th>)}
</tr></thead>
<tbody>{Array.from({length:days},(_,i)=>i+1).map(d=>{
const wdi=getWdayI(year,month,d);
const bg=wdi===0?”#fff5f5”:wdi===6?”#f0f4ff”:”#fff”;

function AdminAttView({year,month,att,shifts,vconf,cfg,sv}){
const {venues}=cfg,days=getDays(year,month);
const [ed,setEd]=useState(null);
// ★修正：vconfがstring形式にも対応
const actualVenue=(d,vName)=>{
if(vconf&&vconf[d]){if(typeof vconf[d]===“string”) return vconf[d];if(vconf[d][vName]) return vconf[d][vName];}
return vName;
};
const rows=[];
for(let d=1;d<=days;d++) for(const v of venues){
const key=`${d}-${v.name}`,rec=att[key],sched=shifts[d]?.[v.name]||””;
if(rec||sched)rows.push({d,venue:actualVenue(d,v.name),venueKey:v.name,sched,rec,key});
}
const verify=key=>sv.att({…att,[key]:{…att[key],verified:true,verifiedAt:new Date().toISOString()}});
const saveEdit=()=>{
if(!ed)return;
const existing=att[ed.key]||{staff:ed.newStaff||””,submittedAt:new Date().toISOString()};
sv.att({…att,[ed.key]:{…existing,start:ed.s,end:ed.e,breakMin:ed.b,verified:false}});
setEd(null);
};
return <div>
<div style={{…GC,display:“flex”,gap:20}}>
{[[“入力済”,rows.filter(r=>r.rec).length,C.blue],[“承認済”,rows.filter(r=>r.rec?.verified).length,C.green],
[“未入力”,rows.filter(r=>!r.rec&&r.sched).length,C.amber]].map(([l,v,c])=>(
<div key={l} style={{textAlign:“center”}}><div style={{fontSize:24,fontWeight:800,color:c}}>{v}</div>
<div style={{fontSize:11,color:C.muted}}>{l}</div></div>))}
</div>
<div style={{…GC,overflowX:“auto”,padding:0}}>
<table style={{width:“100%”,borderCollapse:“collapse”,minWidth:500}}>

<th style={TH}>日付</th><th style={TH}>曜</th><th style={TH}>会場</th>
<th style={TH}>予定</th><th style={TH}>実際</th><th style={TH}>時間</th><th style={TH}>状態</th>
</tr></thead>
<tbody>{rows.map(({d,venue,sched,rec,key})=>{
const wdi=getWdayI(year,month,d),h=rec?parseHours(rec.start,rec.end,rec.breakMin??60):null;
const isEd=ed?.key===key;
return <React.Fragment key={key}>
<tr style={{background:rec?.verified?”#f0fdf4”:”#fff”,cursor:rec?“pointer”:“default”}}
onClick={()=>rec&&!isEd&&setEd({key,s:rec.start,e:rec.end,b:rec.breakMin??60})}>
<td style={{…TD,textAlign:“center”,fontWeight:700}}>{month}/{d}</td>
<td style={{…TD,textAlign:“center”,fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.muted}}>{getWday(year,month,d)}</td>
<td style={TD}>{venue}</td><td style={TD}>{sched||”-”}</td>
<td style={{...TD,fontWeight:600}}>{rec?.staff||<span style={{color:C.muted,fontWeight:400}}>未入力</span>}</td>
<td style={{...TD,color:C.muted}}>{rec?`${rec.start}〜${rec.end} 休憩${rec.breakMin??60}分（実働${h}h)`:“−”}</td>
<td style={{…TD,textAlign:“center”}}>
{!rec&&<button onClick={e=>{e.stopPropagation();setEd({key,s:“09:00”,e:“16:00”,b:60,newStaff:sched});}} style={{…Btn(C.amber),fontSize:11,padding:“4px 8px”}}>入力</button>}
{rec&&!rec.verified&&<div style={{display:“flex”,gap:4,justifyContent:“center”,flexWrap:“wrap”}}>
<button onClick={e=>{e.stopPropagation();setEd({key,s:rec.start,e:rec.end,b:rec.breakMin??60});}} style={{…Btn(C.blue),fontSize:11,padding:“4px 8px”}}>修正</button>
<button onClick={e=>{e.stopPropagation();verify(key);}} style={{…Btn(C.purple),fontSize:11,padding:“4px 8px”}}>承認</button>
</div>}
{rec?.verified&&<div style={{display:“flex”,gap:4,justifyContent:“center”,flexWrap:“wrap”}}>
<button onClick={e=>{e.stopPropagation();setEd({key,s:rec.start,e:rec.end,b:rec.breakMin??60});}} style={{…Btn(C.muted),fontSize:11,padding:“4px 8px”}}>修正</button>
<span style={{color:C.green,fontSize:12,fontWeight:700}}>✅</span>
</div>}
</td>
</tr>
{isEd&&<tr><td colSpan={7} style={{padding:“12px 16px”,background:”#f0f7ff”,borderBottom:`2px solid ${C.blue}`}}>
<div style={{display:“flex”,gap:8,alignItems:“center”,flexWrap:“wrap”}}>
<span style={{fontSize:12,fontWeight:700,color:C.blue}}>✏️ 編集中</span>
<label style={{fontSize:12}}>開始</label>
<input type=“time” value={ed.s} onChange={e=>setEd({…ed,s:e.target.value})}
style={{border:`1px solid ${C.border}`,borderRadius:6,padding:“4px 8px”,fontSize:13}}/>
<label style={{fontSize:12}}>終了</label>
<input type=“time” value={ed.e} onChange={e=>setEd({…ed,e:e.target.value})}

</td></tr>}
</React.Fragment>;
})}</tbody>
</table>
</div>

  </div>;

function normalizeBillingVenue(venueName) {
if (venueName === “小さな多治米”) return “小さな多治米”;
if (venueName === “小さな蔵王”) return “小さな蔵王”;
if (venueName === “花園”) return “花園”;
if (venueName === “多治米”) return “多治米”;
if (venueName === “春日”) return “春日”;
if (venueName === “多or蔵”) return “多or蔵（未振り分け）”;
return venueName;
}

function AccountingView({year,month,att,shifts,vconf,cfg}){
const {staff,venues,staffRates={}}=cfg;
const days=getDays(year,month);

// ★修正：vconfがstring形式にも対応
const actualVenue=(d,vName)=>{
if(vconf&&vconf[d]){if(typeof vconf[d]===“string”) return vconf[d];if(vconf[d][vName]) return vconf[d][vName];}
return vName;
};

const staffRows=staff.map(name=>{
let totalDays=0,totalHours=0,totalOT=0;
for(let d=1;d<=days;d++) for(const v of venues){
if(shifts[d]?.[v.name]===name){
const key=`${d}-${v.name}`,rec=att[key];
const h=rec?parseHours(rec.start,rec.end,rec.breakMin??60):DEFAULT_HOURS;
const ot=Math.max(0,Math.round((h-OVERTIME_HOURS)*100)/100);
totalDays++;totalHours+=h;totalOT+=ot;
}
}
totalHours=Math.round(totalHours*100)/100;
totalOT=Math.round(totalOT*100)/100;
const rate=staffRates[name]||RATE_STAFF;
const pay=Math.round(totalHours*rate);
return {name,totalDays,totalHours,totalOT,pay,rate};
}).filter(r=>r.totalDays>0);

const venueMap={};
for(let d=1;d<=days;d++) for(const v of venues){
const sn=shifts[d]?.[v.name];if(!sn)continue;
const aVenue=actualVenue(d,v.name);
const billingVenue=normalizeBillingVenue(aVenue);
const key=`${d}-${v.name}`,rec=att[key];
const h=rec?parseHours(rec.start,rec.end,rec.breakMin??60):DEFAULT_HOURS;
if(!venueMap[billingVenue]) venueMap[billingVenue]={name:billingVenue,days:0,hours:0};
venueMap[billingVenue].days++;venueMap[billingVenue].hours+=h;
}
const venueRows=Object.values(venueMap).map(r=>{
r.hours=Math.round(r.hours*100)/100;
r.sub=Math.round(r.hours*RATE_BILL);
r.tax=Math.round(r.sub*TAX_RATE);
r.total=r.sub+r.tax;
return r;
});

const totalPay=staffRows.reduce((a,r)=>a+r.pay,0);
const totalBill=venueRows.reduce((a,r)=>a+r.total,0);
const margin=totalBill-totalPay;
const totalOT=staffRows.reduce((a,r)=>a+r.totalOT,0);

const dlStaffCSV=()=>{
const rows=[[`${year}年${month}月 コンシェルジュ給与明細`],[””],
[“コンシェルジュ名”,“時給”,“日数”,“実働時間”,“残業時間”,“支払額”],
…staffRows.map(r=>[r.name,r.rate,r.totalDays,r.totalHours,r.totalOT,r.pay]),
[“合計”,””,staffRows.reduce((a,r)=>a+r.totalDays,0),staffRows.reduce((a,r)=>a+r.totalHours,0),totalOT,totalPay]];
downloadCSV(`給与明細_${year}年${month}月.csv`,rows);
};
const dlVenueCSV=()=>{

const dlDetailCSV=()=>{
const rows=[[`${year}年${month}月 出勤詳細`],[””],
[“名前”,“日付”,“曜日”,“会場”,“開始”,“終了”,“休憩(分)”,“実働(h)”,“残業(h)”,“時給”,“支払額”,“承認”]];

function MyShift({year,month,shifts,vconf,uname,cfg}){
const days=getDays(year,month);
const myDays=[];
for(let d=1;d<=days;d++) for(const v of cfg.venues){
if(shifts[d]?.[v.name]===uname){
let display=v.name;
let isPending=false;
if(v.options&&v.options.length>0){
if(vconf&&vconf[d]){
if(typeof vconf[d]===“string”) display=vconf[d];
else if(vconf[d][v.name]) display=vconf[d][v.name];
else isPending=true;
} else {
isPending=true;
}
}
myDays.push({d,isPending,display});
}
}
return <div style={GC}>

function MyRecord({year,month,shifts,att,sv,uname,cfg}){
const days=getDays(year,month),today=new Date();
const [ed,setEd]=useState(null);
const myS=[];
for(let d=1;d<=days;d++){

for(const v of cfg.venues){
if(shifts[d]?.[v.name]===uname){const key=`${d}-${v.name}`;myS.push({d,venue:v.name,key,rec:att[key]});}

}
const submit=()=>{
if(!ed)return;
sv.att({…att,[ed.key]:{staff:uname,start:ed.s,end:ed.e,breakMin:ed.b,submittedAt:new Date().toISOString(),verified:false}});
setEd(null);
};
return <div style={GC}>

{myS.length===0&&<p style={{color:C.muted,fontSize:13}}>入力できる記録がありません</p>}

{rec?.verified&&<span style={{color:C.green,fontSize:12,fontWeight:700}}>✅ 承認済</span>}
{rec&&!rec.verified&&<span style={{color:C.blue,fontSize:12}}>{rec.start}〜{rec.end}（休憩{rec.breakMin??60}分・実働{h}h）</span>}
{!rec?.verified&&<button onClick={()=>setEd({key,s:rec?.start||“09:00”,e:rec?.end||“16:00”,b:rec?.breakMin??60})}
style={{…Btn(isE?C.muted:C.blue),marginLeft:“auto”,fontSize:12,padding:“5px 12px”}}>{rec?“修正”:“入力”}</button>}
</div>
{isE&&<div style={{display:“flex”,gap:8,alignItems:“center”,marginTop:10,flexWrap:“wrap”}}>

<label style={{fontSize:12,fontWeight:600}}>終了</label>
<input type=“time” value={ed.e} onChange={e=>setEd({…ed,e:e.target.value})}
style={{border:`1px solid ${C.border}`,borderRadius:6,padding:“5px 8px”,fontSize:14}}/>
<label style={{fontSize:12,fontWeight:600}}>休憩</label>
<select value={ed.b} onChange={e=>setEd({…ed,b:Number(e.target.value)})}
style={{border:`1px solid ${C.border}`,borderRadius:6,padding:“5px 8px”,fontSize:14}}>
{[0,15,30,45,60].map(m=>(

function VenueConfirm({year,month,shifts,vconf,sv,cfg,flash}){
const today=new Date(),todayD=today.getDate();
const isTM=year===today.getFullYear()&&month===today.getMonth()+1;
const days=getDays(year,month);
const flex=cfg.venues.filter(v=>v.options&&v.options.length>0);
const confirm=(d,c)=>{sv.vconf({…vconf,[d]:c});flash(`✅ ${month}/${d} → ${c} に確定しました`);};
const unconfirm=d=>{const nv={…vconf};delete nv[d];sv.vconf(nv);flash(“取消しました”);};

const getConfirmed=(d)=>{
if(!vconf||!vconf[d]) return null;
if(typeof vconf[d]===“string”) return vconf[d];
// オブジェクト形式の場合は最初の値を返す
const vals=Object.values(vconf[d]);
return vals.length>0?vals[0]:null;
};

const rows=[];
for(let d=1;d<=days;d++) for(const v of flex){
const s=shifts[d]?.[v.name];
if(s){
const confirmedVal=getConfirmed(d);
rows.push({d,v,s,du:isTM?d-todayD:null,confirmed:confirmedVal});
}
}
const pending=rows.filter(r=>!r.confirmed);
const done   =rows.filter(r=> r.confirmed);
const urgent =pending.filter(r=>r.du!==null&&r.du>=0&&r.du<=1);
const rest   =pending.filter(r=>!urgent.includes(r));

return <div>
{urgent.map(({d,v,s,du})=>(
<div key={d} style={{background:“linear-gradient(135deg,#dc2626,#b91c1c)”,color:”#fff”,
borderRadius:14,padding:20,marginBottom:12,boxShadow:“0 4px 20px rgba(220,38,38,.3)”}}>
<div style={{fontSize:12,fontWeight:700,opacity:.8,marginBottom:4}}>
⚠️ {du===0?”【本日】”:”【明日】”} 会場を確定してください
</div>
<div style={{fontSize:20,fontWeight:800,marginBottom:2}}>{month}/{d}({getWday(year,month,d)}) {s}さん</div>
<div style={{fontSize:13,opacity:.8,marginBottom:16}}>どちらの会場に入りますか？</div>
<div style={{display:“flex”,gap:12}}>
{v.options.map(opt=>(
<button key={opt} onClick={()=>confirm(d,opt)}
style={{flex:1,background:”#fff”,color:C.red,border:“none”,borderRadius:12,
padding:“16px 10px”,cursor:“pointer”,fontSize:18,fontWeight:800,
boxShadow:“0 2px 8px rgba(0,0,0,.2)”}}>📍 {opt}</button>
))}
</div>
</div>
))}
{rest.length>0&&<div style={GC}>
<h3 style={{margin:“0 0 12px”,fontSize:14,color:C.amber}}>⏳ 未確定（{rest.length}件）</h3>
{rest.map(({d,v,s,du})=>{
const wdi=getWdayI(year,month,d);
return <div key={d} style={{display:“flex”,alignItems:“center”,gap:8,flexWrap:“wrap”,
borderBottom:`1px solid ${C.border}`,padding:“12px 0”}}>
<span style={{fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.text}}>
{month}/{d}({getWday(year,month,d)})
</span>
{du!==null&&du>1&&<span style={{fontSize:12,color:C.muted}}>あと{du}日</span>}
{du!==null&&du<0&&<span style={{fontSize:11,color:C.red}}>（過去）</span>}
<span style={{fontWeight:600}}>{s}</span>
<div style={{marginLeft:“auto”,display:“flex”,gap:6}}>
{v.options.map(opt=><button key={opt} onClick={()=>confirm(d,opt)}
style={{…Btn(C.teal),fontSize:13,padding:“7px 16px”}}>📍 {opt}</button>)}
</div>
</div>;
})}
</div>}
{done.length>0&&<div style={GC}>
<h3 style={{margin:“0 0 12px”,fontSize:14,color:C.green}}>✅ 確定済み（{done.length}件）</h3>
{done.map(({d,s,confirmed})=>{
const wdi=getWdayI(year,month,d);
return <div key={d} style={{display:“flex”,alignItems:“center”,gap:8,flexWrap:“wrap”,
borderBottom:`1px solid ${C.border}`,padding:“10px 0”}}>
<span style={{fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.text}}>{month}/{d}({getWday(year,month,d)})</span>
<span style={{fontWeight:600}}>{s}</span>
<span style={{background:C.tealL,color:C.teal,borderRadius:6,padding:“2px 10px”,fontSize:13,fontWeight:700}}>📍 {confirmed}</span>
<button onClick={()=>unconfirm(d)} style={{marginLeft:“auto”,color:C.muted,background:“none”,
border:`1px solid ${C.border}`,borderRadius:6,padding:“4px 10px”,cursor:“pointer”,fontSize:12}}>取消</button>
</div>;
})}
</div>}
{pending.length===0&&done.length===0&&
<div style={{…GC,textAlign:“center”,color:C.muted,padding:48}}>
<div style={{fontSize:36,marginBottom:8}}>✅</div>
<p style={{margin:0}}>この月の確定作業はありません</p>
</div>}

  </div>;
}

{[[“未承認”,rows.filter(r=>r.rec&&!r.rec.verified).length,C.red],

{display.length>0&&<table style={{width:“100%”,borderCollapse:“collapse”,minWidth:440}}>
<thead><tr style={{background:”#f8f9fb”}}>
<th style={TH}>日付</th><th style={TH}>曜</th><th style={TH}>会場</th>

<td style={{…TD,textAlign:“center”,fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.muted}}>{getWday(year,month,d)}</td>
<td style={TD}>{venue}</td>
<td style={{...TD,fontWeight:600}}>{rec?.staff||sched||“−”}</td>
<td style={{...TD,color:C.muted}}>{rec?`${rec.start}〜${rec.end}`:“未入力”}</td>
<td style={{…TD,textAlign:“center”}}>
{!rec&&<span style={{color:C.amber,fontSize:12,fontWeight:600}}>未入力</span>}
{rec&&!rec.verified&&<button onClick={()=>verify(key)} style={{…Btn(C.purple),fontSize:12,padding:“5px 12px”}}>承認する</button>}
{rec?.verified&&<span style={{color:C.green,fontSize:12,fontWeight:700}}>✅ 承認済</span>}
</td>
</tr>;
})}</tbody>
</table>}
</div>

  </div>;
}

{[[“合計時間”,`${totalH}h`,C.blue],[“合計費用(税込)”,yen(totalTotal),C.purple]].map(([l,v,c])=>(

{[…sessions].sort((a,b)=>a.date>b.date?1:-1).map(s=>(

  </div>;

function MCRecordTab({ year, month, cfg, uname, flash }) {
const [records, setRecords] = useState([]);
const [loading, setLoading] = useState(true);
const [form, setForm] = useState({
company:“飛鳥会館”, venue:“春日”, role:“司会”, type:“2日葬”,
date:`${year}/${p2(month)}/${p2(new Date().getDate())}`,
});
const [saving, setSaving] = useState(false);
const storageKey = `mc-${year}-${p2(month)}-${uname}`;

useEffect(() => {
stLoad(storageKey).then(d => {
setRecords(d||[]);
setLoading(false);
});
}, [storageKey]);

const save = async () => {
setSaving(true);
const newRec = { …form, id: Date.now(), staff: uname, createdAt: new Date().toISOString() };
const updated = […records, newRec];
await stSave(storageKey, updated);
setRecords(updated);
setSaving(false);
flash(“✅ 記録しました”);
};

const del = async (id) => {
const updated = records.filter(r => r.id !== id);
await stSave(storageKey, updated);
setRecords(updated);
flash(“削除しました”);
};

const venues = MC_COMPANIES[form.company] || [];
const staffRate = (cfg.mcRates||{})[uname]?.[form.company]?.[form.role] || 0;

return (

<div style={GC}>

<div style={{display:“flex”,flexDirection:“column”,gap:10}}>
<div>
<label style={{fontSize:12,color:C.muted,display:“block”,marginBottom:4}}>日付</label>
<input type=“date” value={form.date.replace(///g,”-”)}
onChange={e=>setForm({…form,date:e.target.value.replace(/-/g,”/”)})}
style={{border:`1px solid ${C.border}`,borderRadius:8,padding:“8px 12px”,fontSize:14,width:“100%”,boxSizing:“border-box”}}/>
</div>
<div>
<label style={{fontSize:12,color:C.muted,display:“block”,marginBottom:4}}>会社</label>
<div style={{display:“flex”,gap:8}}>
{Object.keys(MC_COMPANIES).map(c=>(
<button key={c} onClick={()=>setForm({…form,company:c,venue:MC_COMPANIES[c][0]})}
style={{flex:1,border:`2px solid ${form.company===c?"#e8784a":C.border}`,
borderRadius:8,padding:“8px 4px”,cursor:“pointer”,fontSize:12,fontWeight:700,
background:form.company===c?”#fff8f0”:”#fff”,
color:form.company===c?”#e8784a”:C.muted}}>
{c}
</button>
))}
</div>
</div>
<div>
<label style={{fontSize:12,color:C.muted,display:“block”,marginBottom:4}}>会場</label>
<select value={form.venue} onChange={e=>setForm({…form,venue:e.target.value})}
style={{width:“100%”,border:`1px solid ${C.border}`,borderRadius:8,padding:“8px 10px”,fontSize:14}}>
{venues.map(v=><option key={v} value={v}>{v}</option>)}
</select>
</div>
<div>
<label style={{fontSize:12,color:C.muted,display:“block”,marginBottom:4}}>役割</label>
<div style={{display:“flex”,gap:6}}>
{MC_ROLES.map(r=>(
<button key={r} onClick={()=>setForm({…form,role:r})}
style={{flex:1,border:`2px solid ${form.role===r?C.blue:C.border}`,
borderRadius:8,padding:“8px 4px”,cursor:“pointer”,fontSize:12,fontWeight:700,
background:form.role===r?C.blueL:”#fff”,
color:form.role===r?C.blue:C.muted}}>
{r}
</button>
))}
</div>
</div>
{form.role!==“パントリー”&&(
<div>
<label style={{fontSize:12,color:C.muted,display:“block”,marginBottom:4}}>種別</label>
<div style={{display:“flex”,gap:6}}>
{MC_TYPES.map(t=>(
<button key={t} onClick={()=>setForm({…form,type:t})}
style={{flex:1,border:`2px solid ${form.type===t?C.purple:C.border}`,
borderRadius:8,padding:“8px 4px”,cursor:“pointer”,fontSize:11,fontWeight:700,

{staffRate>0&&(

{staffRate===0&&(
<div style={{background:C.amberL,borderRadius:8,padding:“8px 12px”,fontSize:12,color:C.amber}}>

<button onClick={save} disabled={saving}
style={{…Btn(C.green),padding:“12px”,fontSize:14,opacity:saving?0.6:1}}>

function MCAccountingView({ year, month, cfg }) {
const { staff } = cfg;
const [allRecords, setAllRecords] = useState([]);
const [loading, setLoading] = useState(true);
const billing = cfg.mcBilling || DEFAULT_MC_BILLING;
const rates   = cfg.mcRates   || {};

useEffect(() => {
Promise.all(
staff.map(s => stLoad(`mc-${year}-${p2(month)}-${s}`).then(d=>(d||[]).map(r=>({…r,staff:s}))))
).then(all => {
setAllRecords(all.flat());
setLoading(false);
});
}, [year, month, staff]);

if (loading) return <div style={{padding:40,textAlign:“center”,color:C.muted}}>読み込み中…</div>;

const staffSummary = staff.map(name => {
const recs = allRecords.filter(r=>r.staff===name);
let pay = 0;
recs.forEach(r => {
const rateKey = r.training ? “研修” : r.role;
const rate = rates[name]?.[r.company]?.[rateKey] || 0;
pay += rate;
});
return { name, count:recs.length, pay, recs };
}).filter(s=>s.count>0);

const billByCompany = {};
Object.keys(MC_COMPANIES).forEach(company => {
let total=0, tax=0;
allRecords.filter(r=>r.company===company).forEach(r => {
const t = r.role===“パントリー”?“2日葬”:(r.type||“2日葬”);
const amt = billing[company]?.[r.role]?.[t] || 0;
total += amt;
tax   += Math.round(amt * TAX_RATE);
});
billByCompany[company] = { sub:total, tax, total:total+tax, count:allRecords.filter(r=>r.company===company).length };
});

const totalPay  = staffSummary.reduce((a,s)=>a+s.pay,0);
const totalBill = Object.values(billByCompany).reduce((a,b)=>a+b.total,0);

const dlCSV = () => {
const rows = [
[`${year}年${month}月 司会・アシスタント出勤記録`],[``],
[“スタッフ”,“日付”,“会社”,“会場”,“役割”,“種別”,“支払単価(円)”,“請求単価(円)”,“請求額税抜”,“消費税”],
];
allRecords.sort((a,b)=>a.date>b.date?1:-1).forEach(r=>{
const pay = rates[r.staff]?.[r.company]?.[r.role] || 0;
const t   = r.role===“パントリー”?“2日葬”:(r.type||“2日葬”);
const bill= billing[r.company]?.[r.role]?.[t] || 0;
rows.push([r.staff,r.date,r.company,r.venue,r.role,r.role===“パントリー”?”－”:t,
pay,bill,bill,Math.round(bill*TAX_RATE)]);
});
downloadCSV(`MC出勤記録_${year}年${month}月.csv`,rows);
};

return (
<div>
<div style={{display:“flex”,gap:10,marginBottom:14,flexWrap:“wrap”}}>
{[
{label:“葬儀場への請求合計”,val:yen(totalBill),color:C.navy},
{label:“スタッフへの支払合計”,val:yen(totalPay),color:C.blue},
{label:“差引（粗利）”,val:yen(totalBill-totalPay),color:(totalBill-totalPay)>=0?C.green:C.red},
].map(({label,val,color})=>(
<div key={label} style={{…GC,marginBottom:0,flex:“1 1 130px”,textAlign:“center”,padding:“14px 10px”}}>
<div style={{fontSize:11,color:C.muted,marginBottom:4}}>{label}</div>
<div style={{fontSize:17,fontWeight:800,color}}>{val}</div>
</div>
))}
</div>
<div style={GC}>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“center”,marginBottom:12,flexWrap:“wrap”,gap:8}}>
<h3 style={{margin:0,fontSize:14}}>👤 スタッフ別集計</h3>
<button style={{…Btn(C.green),fontSize:12,padding:“6px 14px”}} onClick={dlCSV}>📥 CSV出力</button>
</div>
{staffSummary.length===0&&<p style={{color:C.muted,fontSize:13}}>記録がありません</p>}
<div style={{overflowX:“auto”}}>
<table style={{width:“100%”,borderCollapse:“collapse”}}>
<thead><tr style={{background:”#f8f9fb”}}>
<th style={TH}>スタッフ</th><th style={TH}>回数</th><th style={TH}>支払額</th>
</tr></thead>
<tbody>
{staffSummary.map(s=>(
<tr key={s.name}>
<td style={{...TD,fontWeight:700}}>{s.name}</td>
<td style={{…TD,textAlign:“center”}}>{s.count}回</td>
<td style={{…TD,textAlign:“right”,fontWeight:800,color:C.blue}}>{yen(s.pay)}</td>
</tr>
))}
<tr style={{background:”#f8f9fb”}}>
<td style={{...TD,fontWeight:800}}>合計</td>
<td style={{…TD,textAlign:“center”,fontWeight:700}}>{staffSummary.reduce((a,s)=>a+s.count,0)}回</td>
<td style={{…TD,textAlign:“right”,fontWeight:800,color:C.blue,fontSize:15}}>{yen(totalPay)}</td>
</tr>
</tbody>
</table>
</div>
</div>
<div style={GC}>
<h3 style={{margin:“0 0 12px”,fontSize:14}}>🏛️ 葬儀場別請求</h3>
<div style={{overflowX:“auto”}}>
<table style={{width:“100%”,borderCollapse:“collapse”}}>
<thead><tr style={{background:”#f8f9fb”}}>
<th style={TH}>会社</th><th style={TH}>件数</th>
<th style={TH}>小計(税抜)</th><th style={TH}>消費税</th><th style={TH}>請求額(税込)</th>
</tr></thead>
<tbody>
{Object.entries(billByCompany).map(([company,b])=>(
<tr key={company}>
<td style={{...TD,fontWeight:700}}>{company}</td>
<td style={{…TD,textAlign:“center”}}>{b.count}件</td>
<td style={{…TD,textAlign:“right”,color:C.muted}}>{yen(b.sub)}</td>
<td style={{…TD,textAlign:“right”,color:C.muted}}>{yen(b.tax)}</td>
<td style={{…TD,textAlign:“right”,fontWeight:800,color:C.purple}}>{yen(b.total)}</td>
</tr>
))}
<tr style={{background:”#f8f9fb”}}>
<td style={{...TD,fontWeight:800}}>合計</td>
<td style={{…TD,textAlign:“center”,fontWeight:700}}>{allRecords.length}件</td>
<td style={{…TD,textAlign:“right”,color:C.muted}}>{yen(Object.values(billByCompany).reduce((a,b)=>a+b.sub,0))}</td>
<td style={{…TD,textAlign:“right”,color:C.muted}}>{yen(Object.values(billByCompany).reduce((a,b)=>a+b.tax,0))}</td>
<td style={{…TD,textAlign:“right”,fontWeight:800,color:C.purple,fontSize:15}}>{yen(totalBill)}</td>
</tr>
</tbody>
</table>
</div>
</div>
<div style={{…GC,overflowX:“auto”,padding:0}}>
<div style={{padding:“14px 16px”,fontWeight:700,fontSize:14,borderBottom:`1px solid ${C.border}`}}>📋 全件明細</div>
{allRecords.length===0&&<p style={{padding:20,textAlign:“center”,color:C.muted,fontSize:13}}>記録がありません</p>}
{allRecords.length>0&&(
<table style={{width:“100%”,borderCollapse:“collapse”,minWidth:480}}>
<thead><tr style={{background:”#f8f9fb”}}>
<th style={TH}>日付</th><th style={TH}>スタッフ</th>
<th style={TH}>会社</th><th style={TH}>会場</th>
<th style={TH}>役割</th><th style={TH}>種別</th>
</tr></thead>
<tbody>
{allRecords.sort((a,b)=>a.date>b.date?1:-1).map(r=>(
<tr key={r.id}>
<td style={{…TD,fontWeight:600,whiteSpace:“nowrap”}}>{r.date}</td>
<td style={{...TD,fontWeight:600}}>{r.staff}</td>
<td style={TD}>{r.company}</td>
<td style={TD}>{r.venue}</td>
<td style={{...TD,fontWeight:600}}>{r.role}</td>
<td style={{...TD,color:C.muted}}>{r.role===“パントリー”?”－”:(r.type||”－”)}</td>
</tr>
))}
</tbody>
</table>
)}
</div>
</div>
);
}

function MCConfigTab({ cfg, sv }) {
const { staff } = cfg;
const [billing, setBilling] = useState(
JSON.parse(JSON.stringify(cfg.mcBilling || DEFAULT_MC_BILLING))
);
const [rates, setRates] = useState(
JSON.parse(JSON.stringify(cfg.mcRates || {}))
);
const [saved, setSaved] = useState(false);

const setRate = (name, company, role, val) => {
const n = {…rates};
if(!n[name]) n[name]={};
if(!n[name][company]) n[name][company]={};
n[name][company][role] = Number(val)||0;
setRates(n);
};

const setBill = (company, role, type, val) => {
const n = JSON.parse(JSON.stringify(billing));
if(!n[company]) n[company]={};
if(!n[company][role]) n[company][role]={};
n[company][role][type] = Number(val)||0;
setBilling(n);
};

const save = () => {
sv.sets({…cfg, mcBilling:billing, mcRates:rates});
setSaved(true);
setTimeout(()=>setSaved(false),2000);
};

return (
<div>
{Object.keys(MC_COMPANIES).map(company=>(
<div key={company} style={GC}>
<h3 style={{margin:“0 0 14px”,fontSize:14,color:C.navy}}>🏛️ {company}　葬儀場への請求単価（税抜）</h3>
<div style={{overflowX:“auto”}}>
<table style={{width:“100%”,borderCollapse:“collapse”,minWidth:360}}>
<thead><tr style={{background:”#f8f9fb”}}>
<th style={TH}>役割</th>
{MC_TYPES.map(t=><th key={t} style={TH}>{t}</th>)}
</tr></thead>
<tbody>
{MC_ROLES.map(role=>(
<tr key={role}>
<td style={{...TD,fontWeight:700}}>{role}</td>
{MC_TYPES.map(type=>(
<td key={type} style={TD}>
{role===“パントリー”&&type!==“2日葬”
? <span style={{color:C.muted,fontSize:12}}>－</span>
: <input type=“number” value={billing[company]?.[role]?.[type]||0}
onChange={e=>setBill(company,role,type,e.target.value)}
style={{width:“100%”,border:`1px solid ${C.border}`,borderRadius:6,
padding:“5px 8px”,fontSize:13,boxSizing:“border-box”}}/>
}
</td>
))}
</tr>
))}
</tbody>
</table>
</div>
</div>
))}
<div style={GC}>
<h3 style={{margin:“0 0 14px”,fontSize:14,color:C.navy}}>👤 スタッフへの支払い単価（1回あたり）</h3>
<p style={{fontSize:12,color:C.muted,marginBottom:12}}>🎓「研修」列はあしべの杜の研修期間中の単価です</p>
<div style={{overflowX:“auto”}}>
<table style={{width:“100%”,borderCollapse:“collapse”,minWidth:500}}>
<thead><tr style={{background:”#f8f9fb”}}>
<th style={{...TH,fontSize:11}}>スタッフ</th>
{Object.keys(MC_COMPANIES).flatMap(c=>
[…MC_ROLES,…(c===“あしべの杜”?[“研修”]:[])].map(r=>(
<th key={`${c}-${r}`} style={{…TH,fontSize:10,color:r===“研修”?”#92400e”:undefined}}>
{c===“飛鳥会館”?“飛鳥”:“あしべ”}<br/>{r}
</th>
))
)}
</tr></thead>
<tbody>
{staff.map(name=>(
<tr key={name}>
<td style={{…TD,fontWeight:700,whiteSpace:“nowrap”,fontSize:12}}>{name}</td>
{Object.keys(MC_COMPANIES).flatMap(company=>
[…MC_ROLES,…(company===“あしべの杜”?[“研修”]:[])].map(role=>(
<td key={`${company}-${role}`} style={TD}>
<input type=“number”
value={rates[name]?.[company]?.[role]||””}
onChange={e=>setRate(name,company,role,e.target.value)}
placeholder=“0”
style={{width:“100%”,minWidth:55,border:`1px solid ${role==="研修"?"#f59e0b":C.border}`,
borderRadius:6,padding:“4px 6px”,fontSize:12,boxSizing:“border-box”,
background:role===“研修”?”#fffbeb”:”#fff”}}/>
</td>
))
)}
</tr>
))}
</tbody>
</table>
</div>
</div>
<button style={{…Btn(saved?C.green:C.navy),padding:“12px 24px”,fontSize:14}} onClick={save}>
{saved?“✅ 保存しました”:“保存する”}
</button>
</div>
);
}

ReactDOM.createRoot(document.getElementById(‘root’)).render(<App/>);
</script>
